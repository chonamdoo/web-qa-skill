name: Skill update eval
on:
  pull_request:
    paths: ['skills/**', 'evals/**', 'tests/**', 'package*.json', 'tsconfig.json', 'README.md', '.github/workflows/eval.yml']
  push:
    branches: [main]
    paths: ['skills/**', 'evals/**', 'tests/**', 'package*.json', 'tsconfig.json', 'README.md', '.github/workflows/eval.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    outputs:
      behavior-report: ${{ steps.behavior-report.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - name: Check behavioral report availability
        id: behavior-report
        shell: bash
        run: |
          if [[ -e evals/results/current.json || -L evals/results/current.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Behavioral eval BLOCKED: current report missing; evidence validation skipped."
            echo "Behavioral eval: **BLOCKED** — current report missing. Static success does not certify skill behavior." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run eval:static
  behavior-evidence:
    needs: static
    if: needs.static.outputs.behavior-report == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require current independently judged behavioral evidence
        run: node evals/scripts/check-eval.mjs check
